[package]
name = "mochi"
version = "0.1.0"
description = "A cute desk mascot that pops helpful tips on your screen."
authors = ["Seif Sgayer"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "mochi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
log = "0.4"
user-idle = "0.6"
active-win-pos-rs = "0.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
