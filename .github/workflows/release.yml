# Builds the Windows installer. Pull requests get it as a workflow artifact;
# a pushed version tag (v1.2.3) on main publishes it to a GitHub Release as Mochi-setup.exe,
# the stable name the landing page's download button links to.
# Actions are pinned to commit SHAs (tag in the comment).
name: release

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release half-way; superseded PR builds may go.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build installer
        run: npx tauri build --bundles nsis

      - name: Stable installer name
        shell: bash
        run: cp src-tauri/target/release/bundle/nsis/*-setup.exe Mochi-setup.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Mochi-setup
          path: Mochi-setup.exe
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag is on main and matches the app version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main"; exit 1; }
          app="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          [ "$app" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != app $app (src-tauri/tauri.conf.json)"; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Mochi-setup

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Mochi-setup.exe --title "Mochi $GITHUB_REF_NAME" --generate-notes
